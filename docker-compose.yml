version: '3.9'

# ── IPO Copilot AI — Docker Compose ──────────────────────────────────────────
# Stack: FastAPI + Groq (llama-3.3-70b-versatile) + ChromaDB + SQLite (dev) / PostgreSQL (prod)
#
# Prerequisites:
#   1. Copy backend/.env.example to backend/.env and fill in GROQ_API_KEY and GOOGLE_API_KEY
#   2. Run: docker compose up --build
#
# NEVER commit backend/.env to version control.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ipo_postgres
    environment:
      POSTGRES_DB: ipo_copilot
      POSTGRES_USER: ipo
      # Source password from env — never hardcode in source-controlled files
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo -d ipo_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipo_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ipo:${POSTGRES_PASSWORD:-change-me-in-env}@postgres:5432/ipo_copilot
      - SECRET_KEY=${SECRET_KEY:-hackathon-secret-key}
      # ── AI Stack: Groq (NOT OpenAI) ────────────────────────────────────────
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_chroma:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    container_name: ipo_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development

volumes:
  postgres_data:
  backend_uploads:
  backend_chroma:

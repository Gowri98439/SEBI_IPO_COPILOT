version: '3.9'

# ── IPO Copilot AI — Production Docker Compose ───────────────────────────────
# Usage:
#   1. Copy .env.example to .env and set all required values
#   2. docker compose -f docker-compose.prod.yml up --build -d

services:

  postgres:
    image: postgres:16-alpine
    container_name: ipo_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ipo_copilot
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env variable is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo -d ipo_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed externally in production
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ipo_backend_prod
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://ipo:${POSTGRES_PASSWORD}@postgres:5432/ipo_copilot
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY env variable is required}
      - GROQ_API_KEY=${GROQ_API_KEY:?GROQ_API_KEY env variable is required}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost}
    volumes:
      - backend_uploads:/app/uploads
      - backend_chroma:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: ipo_frontend_prod
    restart: unless-stopped
    # Frontend is accessed via the nginx reverse proxy, not directly
    expose:
      - "80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Nginx reverse proxy — routes /api/* to backend:8000, /* to frontend:80
  # Access the application at http://localhost:8080
  nginx:
    image: nginx:1.25-alpine
    container_name: ipo_nginx_prod
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # NOTE: ./nginx/ssl is intentionally omitted — no TLS certs in repo.
      # Add TLS termination via a cloud load balancer (AWS ALB, Cloudflare)
      # or configure certbot + nginx SSL outside this compose file.
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_uploads:
  backend_chroma:

# ── IPO Copilot AI — Production Nginx Reverse Proxy ─────────────────────────
#
# Architecture:
#   External: 8080 (HTTP)
#   Routes:
#     /api/*    → backend:8000   (FastAPI)
#     /*        → frontend:80    (React SPA served by nginx)
#
# NOTE: HTTPS/TLS is NOT configured here.
# In production, place a TLS-terminating load balancer (AWS ALB, Cloudflare,
# or Nginx with certbot) in front of this proxy.
#
# Service names 'backend' and 'frontend' are resolved by Docker's internal DNS.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging format ────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Upstream services (Docker internal DNS) ───────────────────────────
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 16;
    }

    # ── Request size limit ────────────────────────────────────────────────
    # Must be >= MAX_UPLOAD_SIZE_MB (default 50MB in config.py)
    client_max_body_size 60M;

    # ── Rate limiting zones ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ────────────────────────────────────────────────────────────────────
    # Main server block — HTTP on port 8080
    # ────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security headers ─────────────────────────────────────────
        # Note: backend already sets these via SecurityHeadersMiddleware.
        # Nginx also adds them for static frontend responses.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ── Health check for container orchestrator ───────────────────
        location /nginx-health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ── Backend API proxy ─────────────────────────────────────────
        # All /api/* requests are forwarded to the FastAPI backend.
        # CRITICAL: This block must come BEFORE the SPA catch-all.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout for DRHP generation pipeline (~60s+)
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;

            # Disable buffering for SSE (Server-Sent Events used by Copilot)
            proxy_buffering off;
        }

        # ── Backend root/health/docs (non-/api paths on backend) ────
        # The FastAPI backend also has /health, /docs, /redoc at root level.
        location ~ ^/(health|docs|redoc|openapi.json)$ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Static frontend assets — aggressive caching ───────────────
        # Vite build hashes filenames so 1-year cache is safe.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # Let the nginx frontend container handle caching headers
            # (it already sets 1y Cache-Control for hashed assets)
            proxy_cache_bypass 0;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── SPA catch-all — must be last ───────────────────────────────
        # All other requests go to the React SPA.
        # The frontend nginx container handles index.html routing.
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # No caching for HTML (SPA index.html should always be fresh)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }
}
